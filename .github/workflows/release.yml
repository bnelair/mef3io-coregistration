name: release

# Builds the sdist and the (pure-Python) wheel, tests the built wheel, and
# publishes to PyPI. Triggered by a version tag (created by the bump-version
# workflow, which also dispatches this workflow explicitly — tags pushed with
# GITHUB_TOKEN do not fire tag-push events). A plain workflow_dispatch on a
# branch is a dry run: the build is tested and uploaded as an artifact, but
# publishing is skipped.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGCOREG_DATA_DIR: ${{ runner.temp }}/sigcoreg-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(tr -d ' \n' < VERSION)" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, VERSION $(cat VERSION)"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      # The suite runs against the INSTALLED wheel, so a file missing from the
      # wheel fails here rather than for the first user.
      - name: Test the built wheel
        run: |
          pip install "$(ls dist/*.whl)[test]"
          (cd "$RUNNER_TEMP" && python -c "import mef3io_coregistration as m; assert 'site-packages' in m.__file__, m.__file__")
          pytest -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_Token_General }}
        run: |
          python -m pip install --upgrade pip twine
          twine upload --skip-existing dist/*

  # GitHub release with the sdist and wheel attached. Its text is the reviewed
  # release-notes page (docs/release_notes/X.Y.Z.md, absolute links) when the
  # release has one, GitHub's generated notes otherwise.
  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release and attach the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          notes="docs/release_notes/$v.md"
          if [ -f "$notes" ]; then body=(--notes-file "$notes"); else body=(--generate-notes); fi
          pre=""; [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]] && pre="--prerelease"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" "${body[@]}" $pre
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
