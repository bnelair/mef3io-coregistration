name: release

# Started by bump-version on a vX.Y.Z tag: build, test the built wheel, publish to PyPI, create
# the GitHub Release. Run by hand on a branch it is a dry run (build + test, nothing published).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(tr -d ' \n' < VERSION)" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, VERSION $(cat VERSION)"; exit 1; }
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Test the built wheel
        run: |
          pip install "$(ls dist/*.whl)[test]"
          (cd "$RUNNER_TEMP" && python -c "import mef3io_coregistration as m; assert 'site-packages' in m.__file__, m.__file__")
          pytest -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_Token_General }}
        run: |
          python -m pip install --upgrade pip twine
          twine upload --skip-existing dist/*
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]] && pre="--prerelease"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $pre
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
