name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let deploys queue rather than cancel: cancelling an in-flight Pages deploy
  # (e.g. two PRs merged seconds apart) leaves the deployment in a state that
  # makes the next one fail with "try again later". Matches GitHub's
  # recommended Pages workflow.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs tooling
        # The same pins as the [docs] extra. The package itself is not
        # installed: mkdocstrings reads the source statically (paths: [.]).
        run: pip install "mkdocs-material>=9,<10" "mkdocs>=1.6,<2" "mkdocstrings[python]>=0.24"
      - name: Build site (mkdocs + mkdocstrings)
        run: mkdocs build --strict
      - name: Check the built site names no private product
        # Same list as tests/test_public_text.py, encoded so this file
        # does not spell it out; covers the generated API reference too.
        run: |
          test -d site
          pattern="$(echo 'Ym5lbFtfLV1zaWduYWxbXy1dY29yZWdpc3RyYXRpb258c2lnbmFsX2NvcmVnaXN0cmF0aW9uX2FwcA==' | base64 -d)"
          rc=0; grep -rIilE -- "$pattern" site || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::private product name found in the built site (files above), or grep failed (rc=$rc)"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
