name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # The same ruff (pinned in the dev extra) and rules (pyproject) as a local
    # `ruff check .`, so a clean tree locally is a clean tree here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.16,<0.17"
          ruff check .

  python-tests:
    name: pytest ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
    runs-on: ${{ matrix.os }}
    env:
      # Synthetic test recordings go to the runner's temp dir, not next to the
      # installed package (the default for a source checkout is ./data).
      SIGCOREG_DATA_DIR: ${{ runner.temp }}/sigcoreg-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with the test stack
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Version sanity (single source of truth)
        run: |
          python -c "import mef3io_coregistration as m; print('mef3io-coregistration', m.__version__)"
          python -c "import mef3io_coregistration as m, pathlib; v = pathlib.Path('VERSION').read_text().strip(); assert m.__version__ == v, (m.__version__, v)"
      - name: Run test suite
        run: python -m pytest tests -q

  # Newest CPython, without the test stack: install, import, and the
  # self-contained example end to end (align a synthetic pair, save, read).
  python-latest-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install and run the end-to-end example
        run: |
          python -m pip install --upgrade pip
          pip install .
          cd "$RUNNER_TEMP"
          python -c "import mef3io_coregistration as m; assert 'site-packages' in m.__file__, m.__file__; print('py3.14', m.__version__)"
          python "$GITHUB_WORKSPACE/examples/01_align_synthetic_pair.py"
