name: Question
description: Ask how to do something with mef3io-coregistration
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you tried? Never attach real recordings or patient details; a synthetic pair is always enough.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mef3io-coregistration version and Python version
      description: e.g. "0.3.0, Python 3.12"
