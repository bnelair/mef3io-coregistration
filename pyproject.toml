[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mef3io-coregistration"
dynamic = ["version"]
description = "Read two MEF3 recordings as one through a saved coregistration (clock map)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Filip Mivalt", email = "mivalt.filip@mayo.edu" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "mef3io>=1.3.0,<2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.16,<0.17", "build", "twine"]
examples = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/bnelair/mef3io-coregistration"
Issues = "https://github.com/bnelair/mef3io-coregistration/issues"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["mef3io_coregistration", "mef3io_coregistration.*"]

[tool.setuptools.package-data]
mef3io_coregistration = ["py.typed"]  # typed (PEP 561): type checkers use its annotations

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF046", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
